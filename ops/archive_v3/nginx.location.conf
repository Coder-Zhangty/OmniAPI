# Include inside the existing HTTPS server. Keep the exact /archive-v3/ prefix.
location = /archive-v3 { return 308 /archive-v3/; }
location = /archive-v3/internal { return 404; }
location ^~ /archive-v3/internal/ { return 404; }
location = /archive-v3/embed {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $archive_v3_embed_backend archive-v3:8793;
    proxy_pass http://$archive_v3_embed_backend/archive-v3/;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    sub_filter '</head>' '<link rel="stylesheet" href="/brand/archive-v3-embedded.v20261107.css"></head>';
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
location = /archive-v3/api/oauth/callback {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $archive_v3_backend http://archive-v3:8793;
    proxy_pass $archive_v3_backend;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 180s;
}
location ^~ /archive-v3/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $archive_v3_backend http://archive-v3:8793;
    proxy_pass $archive_v3_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 2m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 180s;
    proxy_buffering off;
}
