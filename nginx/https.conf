log_format gateway escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_oneapi_request_id","edge_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstream_status":"$upstream_status","duration":$request_time}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://omniapi.biz$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.omniapi.biz;
    ssl_certificate /etc/letsencrypt/live/omniapi.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omniapi.biz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 308 https://omniapi.biz$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name omniapi.biz;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/omniapi.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omniapi.biz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 32m;
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # 充值申请服务：用户在充值页提交「已付款」后落到这里，经营者端才会收到待核验记录。
    # 服务跑在宿主机上（systemd），不在容器里，故经 host.docker.internal 回连。
    location = /brand/api/topup/request {
        client_max_body_size 8k;
        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 在线客服：长连接要单独一段。^~ 前缀匹配取最长者，所以这两个必须排在
    # /brand/api/ 与 /brand/admin/api/ 之前，否则会落到充值服务上（404）。
    # 服务端会在 1500 秒处主动结束流让客户端带 since 重连，所以这里给足余量，
    # 让「结束」由服务决定而不是被 nginx 截断。
    location ^~ /brand/api/support/ {
        client_max_body_size 32k;
        proxy_pass http://host.docker.internal:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }
    location ^~ /brand/admin/api/support/ {
        client_max_body_size 32k;
        proxy_pass http://host.docker.internal:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }
    # Public recharge metadata, FX quotes and operator-provided payment QR assets.
    location ^~ /brand/api/ {
        client_max_body_size 32k;
        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 管理端接口：口令登录后带 HttpOnly cookie，只有经营者本人能用。
    # ^~ 阻止下面的静态文件正则接管这些路径。
    location ^~ /brand/admin/api/ {
        client_max_body_size 1536k;
        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 页面、目录与样式由 config/*.json 生成，改动必须立刻对访客生效（客服邮箱等）。
    # no-cache 仍走 ETag 校验，未改动时返回 304，不会重传内容。
    location ~ ^/brand/.*\.(html|json|css|js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # 图片与图标体积大、改动少，保留长缓存
    location /brand/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /favicon.ico { alias /usr/share/nginx/html/brand/omniapi.svg; types { } default_type image/svg+xml; }
    location = /logo.png { alias /usr/share/nginx/html/brand/omniapi.svg; types { } default_type image/svg+xml; }
    location = /models { return 308 /pricing; }
    # EPay wallet callback accepts the provider's GET or form POST. Access logs
    # use $uri, so signed query values and merchant data are not persisted.
    location = /api/user/epay/notify {
        client_max_body_size 64k;
        include /etc/nginx/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }
    # rc.40 undercharges CNY-displayed subscription plans on native EPay.
    location = /api/subscription/epay/notify { return 404; }
    location = /api/subscription/epay/return { return 404; }
    location ~ ^/api/(user/(login|register|auth)(/|$)|verification|reset_password) {
        include /etc/nginx/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /api/user/login {
        proxy_pass http://auth-guard:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location = /api/user/register {
        proxy_pass http://auth-guard:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location / {
        include /etc/nginx/proxy-common.conf;
        # Add the wallet manual-top-up link to the embedded New API SPA while
        # leaving API/JSON responses untouched (sub_filter_types is HTML only).
        # admin-badge.js shows the pending-recharge notice inside the console;
        # it stays invisible for anyone without the admin cookie.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/brand/auth-enhance.css?v=20260928-referral2"><link rel="stylesheet" href="/brand/pricing-enhance.css"><link rel="stylesheet" href="/brand/api-access.css"><link rel="stylesheet" href="/brand/announcement-read.css?v=20260928-dialog"></head>';
        sub_filter '</body>' '<script src="/brand/auth-enhance.js?v=20260928-referral2" defer></script><script src="/brand/wallet-topup.js" defer></script><script src="/brand/floating.js" defer></script><script src="/brand/admin-badge.js" defer></script><script src="/brand/pricing-enhance.js" defer></script><script src="/brand/support-widget-v2.js?v=20260929-v4" defer></script><script src="/brand/api-access.js" defer></script><script src="/brand/announcement-read.js?v=20260930-targeted" defer></script></body>';
    }
}

