log_format gateway escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_oneapi_request_id","edge_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstream_status":"$upstream_status","duration":$request_time}';
server {
    listen 80;
    server_name localhost;
    client_max_body_size 32m;
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log crit;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # 充值申请服务（宿主机 systemd），本地部署未安装该服务时返回 502，
    # 充值页会退回「复制申请发给客服」，不阻塞其它功能。
    location = /brand/api/topup/request {
        client_max_body_size 8k;
        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /brand/api/ {
        client_max_body_size 32k;
        proxy_pass http://host.docker.internal:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
    }
    location ^~ /brand/admin/api/ {
        client_max_body_size 1536k;
        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location /brand/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /favicon.ico { alias /usr/share/nginx/html/brand/omniapi.svg; types { } default_type image/svg+xml; }
    location = /logo.png { alias /usr/share/nginx/html/brand/omniapi.svg; types { } default_type image/svg+xml; }
    location / {
        proxy_pass http://new-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_next_upstream off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/brand/auth-enhance.css?v=20260928-referral2"><link rel="stylesheet" href="/brand/pricing-enhance.css"><link rel="stylesheet" href="/brand/api-access.css"><link rel="stylesheet" href="/brand/announcement-read.css?v=20260928-dialog"></head>';
        sub_filter '</body>' '<script src="/brand/auth-enhance.js?v=20260928-referral2" defer></script><script src="/brand/wallet-topup.js" defer></script><script src="/brand/floating.js" defer></script><script src="/brand/admin-badge.js" defer></script><script src="/brand/pricing-enhance.js" defer></script><script src="/brand/support-widget-v2.js?v=20260929-v4" defer></script><script src="/brand/api-access.js" defer></script><script src="/brand/announcement-read.js?v=20260930-targeted" defer></script></body>';
    }
}

