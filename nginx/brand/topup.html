<body data-page="select" class="modern-checkout">

        <div class="amount-display" id="summary-amount">¥100.00</div>
        <div class="field-heading"><label for="amount" class="field-label">充值金额</label><span class="amount-hint" id="amount-hint">¥1 起充，可自定义</span></div>
        <div class="amount-field" id="amount-field"><span aria-hidden="true" id="input-symbol">¥</span><input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="100.00" aria-describedby="amount-hint amount-error" maxlength="20" form="topup-form" disabled=""></div>
        <div class="presets" role="group" aria-label="快捷充值金额" id="presets">
          <button class="preset" type="button" data-amount="10" aria-pressed="false" disabled="">¥10</button>
          <button class="preset" type="button" data-amount="50" aria-pressed="false" disabled="">¥50</button>
          <button class="preset" type="button" data-amount="100" aria-pressed="true" disabled="">¥100</button>

          <button class="preset" id="custom-amount" type="button" aria-pressed="false" disabled="">自定义</button>

        <p class="error" id="amount-error" role="status" hidden="">请输入 ¥1–¥10,000，最多保留两位小数。</p>

        <p class="account">充值至 <strong id="account-name">正在确认账户</strong><input id="checkout-account" readonly="" hidden="" aria-label="充值账户"></p>

      <footer class="payment-footer"><a href="/wallet">充值记录</a><span class="separator" aria-hidden="true"></span><a href="/brand/support.html">遇到问题？</a><a id="manual-wechat" href="/brand/topup-manual.html?method=wechat" hidden="">微信人工核验</a></footer>
