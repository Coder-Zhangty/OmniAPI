<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服工单 · OmniAPI</title><link rel="icon" href="/brand/omniapi.svg"><style>.composer{display:flex;gap:8px;width:100%}.composer textarea{flex:1 1 400px;min-width:0;width:auto}.composer button{width:auto;flex:0 0 auto}.row-actions button{width:auto}.quick button{width:auto}</style><link rel="stylesheet" href="/brand/support-desk.css?v=20260929-layout3"><meta name="robots" content="noindex,nofollow"></head><body>
<div class="s-page"><header class="s-head"><img src="/brand/omniapi.svg" alt=""><strong>客服</strong><span class="s-muted" id="service-hours"></span><span class="grow"></span><button class="s-btn secondary" id="history-btn">历史</button><button class="s-btn" id="new-btn">新建</button></header>
<div class="user-shell" id="shell"><aside class="ticket-list" id="tickets"></aside><main class="user-main" id="main"><div class="s-empty" id="empty">选择历史工单，或新建一个工单。</div><div class="composer"><textarea id="text" aria-label="消息"></textarea><button class="s-btn" type="button">发送</button></div></main></div></div>
<template id="thread-template"><div class="thread-bar"><button class="s-icon" id="back-btn" aria-label="返回">←</button><div class="grow"><strong id="ticket-subject"></strong><span class="s-muted" id="ticket-meta"></span></div><button class="s-btn secondary" id="resolve-btn">确认解决</button></div><div class="timeline" id="timeline"></div><div class="composer"><textarea id="message-text" placeholder="补充问题…"></textarea><div class="composer-row"><label class="s-btn secondary">添加图片<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><span class="s-muted grow" id="file-note">最多 3 张，每张不超过 5 MiB</span><button class="s-btn" id="send-btn">发送</button></div><div class="error" id="send-error"></div></div></template>
<template id="create-template"><section class="create-form"><h2>新建工单</h2><p class="s-muted" id="greeting"></p><label for="category">问题分类</label><select id="category"></select><label for="subject">简短标题</label><input id="subject" maxlength="120" placeholder="例如：充值后余额没有变化"><label for="description">问题描述</label><textarea id="description" maxlength="2000" placeholder="请写明发生时间、Request ID 或错误提示。不要发送密码、API Key 或验证码。"></textarea><div class="error" id="create-error"></div><div class="form-actions"><button class="s-btn" id="create-btn">提交工单</button><button class="s-btn secondary" id="cancel-btn">取消</button></div></section></template>
<script src="/brand/support-v2.js?v=20260929-v2" defer></script></body></html>
