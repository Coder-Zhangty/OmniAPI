<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="omni-checkout" content="commerce"><title>迁移与退出审核 · OmniAPI</title><link rel="stylesheet" href="/brand/commerce-console.css?v=20261104"></head><body><main class="workspace"><header class="page-heading"><div><p class="breadcrumb">管理 <span>/</span> 商品发布</p><h1>迁移与退出审核</h1><p class="page-description">仅最高管理员可操作。核价、能力验收与数据库备份完成后才能切换。</p></div><a class="text-link" href="/brand/commerce-admin.html">返回会员管理 ↗</a></header><p id="message" role="status" class="caption">正在检查权限…</p><section class="management-section"><h2>迁移发布</h2><form id="migration-form"><label>正式权益版本<input id="profile" required maxlength="64"></label><label>迁移批次<input id="batch" required minlength="16" maxlength="64"></label><label>发布验收编号<input id="acceptance" required minlength="16"></label><label>预览校验摘要<input id="preview-hash" maxlength="64" readonly></label><div class="actions"><button type="button" data-action="close_legacy" disabled>停止旧商品购买</button><button type="button" data-action="preview" disabled>生成迁移预览</button><button type="button" data-action="apply" disabled>执行已核对的迁移</button><button type="button" data-action="open_sales" disabled>同时开放个人与共享</button></div></form><pre id="preview" class="audit-output"></pre></section><section class="management-section"><div class="section-heading"><h2>迁移退出申请</h2><button id="refresh-exits" class="quiet" disabled>刷新</button></div><div id="exits" class="table-scroll"></div></section></main><script src="/brand/commerce-session.js" defer></script><script src="/brand/commerce-migration.js" defer></script></body></html>
