<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>安全复核 · OmniAPI</title><link rel="stylesheet" href="/brand/risk-review.v20261028.css"><script defer src="/brand/commerce-session.js"></script><script defer src="/brand/risk-review.v20261028.js"></script></head>
<body><header><a href="/">OmniAPI</a><span>账户安全</span></header><main><p class="eyebrow">ACCOUNT REVIEW</p><h1 id="heading">查看本人安全通知</h1><p id="status" role="status">正在验证身份…</p><section id="login" hidden><p>请使用原来的登录方式完成身份验证；如已设置二次验证，请照常完成。</p><a class="button" href="/login?redirect=%2Fbrand%2Frisk-review.html">验证身份</a></section><section id="private" hidden><div id="notices"></div><form id="risk-email" hidden><h2>验证邮箱</h2><p>完成邮箱验证后仍需管理员复核，不会自动解除限制。已有邮箱需验证原邮箱，无法访问时联系人工核验。</p><label for="risk-email-address">邮箱</label><input id="risk-email-address" type="email" autocomplete="email" required maxlength="50"><button id="risk-email-send" type="button" class="secondary">发送验证码</button><label for="risk-email-code">验证码</label><input id="risk-email-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">确认邮箱</button><p id="risk-email-result" role="status"></p></form><form id="appeal"><h2>提交复核说明</h2><p>说明你的正常使用情况即可，请勿填写密码、验证码或 API Key。</p><label for="body">说明</label><textarea id="body" minlength="5" maxlength="2000" rows="5" required></textarea><button id="submit" type="submit">提交说明</button><p id="result" role="status"></p></form><button id="refresh" class="secondary">刷新复核状态</button><a id="return" href="/wallet" hidden>重新登录后返回钱包 →</a></section></main><footer>临时保护不代表已经确认违规。余额及已有账本保留，处理结果以服务端复核为准。</footer></body></html>
