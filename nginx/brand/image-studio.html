 <header class="header"><div class="heading"><h1>图片工作台</h1><span class="tagline">让想象成为画面</span></div><div class="header-actions"><a class="guide" href="/brand/connect.html" target="_blank" rel="noopener">接入指南<svg><use href="#i-arrow-up"/></svg></a><a href="/wallet" aria-label="个人账户"><i class="avatar" aria-hidden="true"></i></a></div></header>
 <section class="inspector" aria-label="图片生成设置">
  <div class="segments" role="tablist" aria-label="创作模式"><button class="segment" type="button" id="generate-tab" role="tab" aria-selected="true" aria-controls="creation-form" tabindex="0">生成图片</button><button class="segment unavailable" type="button" id="edit-tab" title="先读取支持图片修改的型号" role="tab" disabled aria-selected="false" aria-controls="creation-form" tabindex="-1">修改图片</button></div>
  <form id="creation-form">
   <label for="prompt" class="label">描述画面</label>
   <div class="prompt-wrap"><textarea id="prompt" maxlength="32000" spellcheck="false" required>一只冰蓝色陶瓷花瓶，放在米白色石台上。午后阳光穿过窗户，柔和阴影，简洁的产品摄影。</textarea><div class="prompt-tools"><button class="polish unavailable" type="button" id="polish" title="润色单独按文本用量计费" disabled><svg><use href="#i-wand"/></svg>润色描述</button><button class="undo-polish" id="undo-polish" type="button" hidden>撤销润色</button><span class="char-count"><span id="char-count">0</span> / 32000</span></div></div>
   <input type="file" id="reference-file" accept="image/png,image/jpeg,image/webp" hidden><button class="reference-upload unavailable" type="button" id="reference-upload" title="上传本地PNG、JPEG或WebP参考图" disabled><svg id="attachment-icon"><use href="#i-paperclip"/></svg><img class="reference-thumb" id="reference-thumb" alt="本地参考图" hidden><span id="reference-label">添加参考图</span><span class="optional">可选</span></button>
   <button class="reference-remove" id="reference-remove" type="button" hidden>移除参考图</button><p class="capability-note" id="capability-note" role="status"></p><div class="model-field"><label class="label" for="model">图片模型</label><div class="select-wrap has-icon"><svg class="leading-icon"><use href="#i-cube"/></svg><select id="model" disabled><option value="">读取模型中…</option></select></div></div>
   <div class="ratio-field"><span class="label" id="ratio-label">画面比例</span><div class="ratio-grid" role="group" aria-labelledby="ratio-label"><button class="ratio" type="button" data-ratio="1:1" aria-pressed="true"><i class="ratio-symbol" aria-hidden="true"></i><span>1:1</span></button><button class="ratio" type="button" data-ratio="3:2" aria-pressed="false"><i class="ratio-symbol" aria-hidden="true"></i><span>3:2</span></button><button class="ratio" type="button" data-ratio="2:3" aria-pressed="false"><i class="ratio-symbol" aria-hidden="true"></i><span>2:3</span></button><button class="ratio" type="button" data-ratio="16:9" aria-pressed="false"><i class="ratio-symbol" aria-hidden="true"></i><span>16:9</span></button></div></div>
   <div class="field-pair"><div><label class="label" for="size">尺寸</label><div class="select-wrap"><select id="size" disabled></select></div></div><div><label class="label" for="quality">画质</label><div class="select-wrap"><select id="quality" disabled></select></div></div></div>
   <details class="advanced"><summary>高级设置<svg><use href="#i-chevron"/></svg></summary><div class="advanced-content"><p>每次生成 1 张 PNG；仅提供当前已验收的型号和规格。</p><p>参考图、润色和先读取支持图片修改的型号。</p><div id="extra-options" hidden><label for="service-tier">服务档位</label><select id="service-tier"></select></div></div></details>
   <div class="billing"><div class="cost-row"><span>预计费用</span><strong class="price quote-note" id="price">读取报价中…</strong></div><button class="generate" id="generate" type="submit" disabled><svg><use href="#i-sparkles"/></svg><span>生成图片</span><span class="shortcut" aria-hidden="true">⌘ ↵</span></button><p class="billing-note">按实际生成结果结算</p><p class="live-status" id="status" role="status" aria-live="polite"></p><a class="usage-link" id="usage-link" href="/usage-logs" hidden>查看调用记录</a></div>
  </form>
 </section>
 <main class="workspace" aria-label="生成结果">
  <div class="toolbar"><p class="result-state" data-state="pending"><span class="status-dot" aria-hidden="true"></span><span id="result-state">示例预览</span></p><div class="toolbar-actions"><button class="tool-button" type="button" id="expand"><svg><use href="#i-expand"/></svg>放大查看</button><button class="tool-button" type="button" id="download" disabled title="生成图片后即可下载"><svg><use href="#i-download"/></svg>下载 PNG</button></div></div>
  <section class="canvas-stage" aria-label="图片预览"><div class="artwork" id="artwork" role="img" tabindex="0" aria-label="冰蓝色陶瓷花瓶与橙色浆果枝，放在石台上，午后光影"></div><p class="image-meta sample-label" id="image-meta">效果示例 · 生成后显示实际尺寸与画质</p><div class="zoom" aria-label="预览缩放"><button type="button" id="zoom-out" aria-label="缩小"><svg><use href="#i-minus"/></svg></button><output id="zoom-level">100%</output><button type="button" id="zoom-in" aria-label="放大"><svg><use href="#i-plus"/></svg></button></div></section>
  <section class="session-results" aria-label="本次结果"><h2 class="session-title">本次结果</h2><button class="thumbnail" type="button" id="thumbnail" aria-label="当前为效果示例，尚未生成图片" aria-pressed="true"><span class="thumbnail-picture"></span></button></section>
  <div class="followup-area"><form class="followup" id="followup-form"><input id="followup" aria-label="继续修改图片" placeholder="继续修改：比如「把花瓶换成白色」" autocomplete="off" disabled title="先读取支持图片修改的型号"><button type="submit" aria-label="提交修改" disabled title="先读取支持图片修改的型号"><svg><use href="#i-arrow"/></svg></button></form><p class="retention-note">图片仅在当前页面保留，请及时下载</p></div>
 </main>
</div>
<dialog class="lightbox" id="lightbox" aria-label="放大查看图片"><button class="lightbox-close" type="button" aria-label="关闭预览"><svg><use href="#i-close"/></svg></button><div class="artwork" role="img" aria-label="图片放大预览"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
