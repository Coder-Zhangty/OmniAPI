<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>设置新密码 · OmniAPI</title><link rel="stylesheet" href="/brand/membership.css"></head><body><header><a href="/" class="brand">OmniAPI</a></header><main class="narrow"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>设置新密码。</h1><p class="intro">成功后旧的网站登录凭据将失效。模型 API Key 默认保留。</p><form id="reset-form"><label for="password">新密码<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label for="repeat">再次输入新密码<input id="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label class="inline"><input id="revoke" type="checkbox"> 同时停用全部模型 API Key</label><p id="result" role="status"></p><button id="submit" type="submit">设置新密码</button></form><p class="muted">链接有效期10分钟。没有绑定邮箱且无法登录的旧账号，请使用原第三方登录或联系人工核验。</p><p><a href="/login">返回登录 →</a></p></main><script src="/brand/password-reset.js" defer></script></body></html>
