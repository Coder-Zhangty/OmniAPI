<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服工作台 · OmniAPI</title><link rel="icon" href="/brand/omniapi.svg"><style>.composer{display:flex;gap:8px;width:100%}.composer textarea{flex:1 1 400px;min-width:300px;width:auto}.composer button{width:auto;flex:0 0 auto}.row-actions button{width:auto}.quick button{width:auto}</style><link rel="stylesheet" href="/brand/support-desk.css"><meta name="robots" content="noindex,nofollow"></head><body>
<div class="desk"><header class="desk-top"><img src="/brand/omniapi.svg" alt=""><strong>客服工作台</strong><span class="s-muted" id="connection">正在连接</span><span class="grow"></span><button class="s-btn secondary" id="settings-btn">设置</button><a class="s-btn secondary" href="/console">控制台</a></header><div class="metrics"><span><b id="m-waiting">0</b>待回复</span><span><b id="m-overdue">0</b>超时</span><span><b id="m-unread">0</b>未读</span><span><b id="m-resolved">0</b>今日解决</span></div>
<div class="desk-grid" id="desk-grid"><aside class="queue-pane"><div class="desk-filter"><input id="filter-q" placeholder="搜索用户、标题、工单号"><select id="filter-category"><option value="">全部分类</option><option value="recharge">充值到账</option><option value="api_access">API 接入</option><option value="model_error">模型调用错误</option><option value="billing">计费与扣额</option><option value="account_security">账号与安全</option><option value="other">其他</option></select><select id="filter-status"><option value="">全部状态</option><option value="waiting_operator">等待客服</option><option value="waiting_user">等待用户</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select><select id="filter-priority"><option value="">全部优先级</option><option value="high">高</option><option value="normal">普通</option><option value="low">低</option></select><label><input id="filter-unread" type="checkbox"> 只看未读</label></div><div class="desk-queue" id="desk-queue"></div></aside>
<main class="desk-thread" id="desk-thread"><div class="s-empty">从左侧选择一个工单。</div><div class="composer"><textarea id="text" aria-label="回复"></textarea><button class="s-btn" type="button">发送</button></div></main><aside class="context-pane"><div class="context" id="context"><p class="s-muted">用户上下文会在选择工单后显示。</p></div></aside></div></div>
<div class="settings-pop" id="settings-pop" hidden><form class="settings-form" id="settings-form"><h2>客服设置</h2><h3>即时通知</h3><p class="s-muted" id="set-notify-status">正在读取通知状态…</p><p class="s-muted">企业微信机器人收到新工单后会推送工单摘要和工作台链接。Webhook 只通过服务器隐藏输入工具配置，不会回显到浏览器。</p><label>服务时间</label><input id="set-hours"><label>欢迎语</label><textarea id="set-greeting"></textarea><label>离线说明</label><textarea id="set-offline"></textarea><label>快捷回复（每行一条）</label><textarea id="set-quick" rows="6"></textarea><div class="error" id="settings-error"></div><div class="form-actions"><button class="s-btn" type="submit">保存</button><button class="s-btn secondary" id="settings-cancel" type="button">取消</button></div></form></div>
<script src="/brand/support-admin-v2.js?v=20260929-notify1" defer></script></body></html>
