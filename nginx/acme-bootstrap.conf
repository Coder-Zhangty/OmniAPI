log_format gateway escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_oneapi_request_id","edge_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstream_status":"$upstream_status","duration":$request_time}';
server {
    listen 80 default_server;
    server_name omniapi.biz www.omniapi.biz _;
    client_max_body_size 32m;
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log crit;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { include /etc/nginx/proxy-common.conf; }
}
