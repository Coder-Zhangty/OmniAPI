upstream omni_primary {
    server new-api:3000;
    keepalive 16;
}
upstream omni_text {
    server new-api:3000 weight=4 max_fails=1 fail_timeout=10s;
    server 172.30.10.1:13001 weight=1 max_fails=1 fail_timeout=10s;
    keepalive 16;
}
# Explicit methods and paths only. Any Upgrade or unknown route stays primary.
map "$request_method:$uri" $omni_route {
    default omni_primary;
    "POST:/v1/chat/completions" omni_text;
    "POST:/v1/completions" omni_text;
    "POST:/v1/messages" omni_text;
    "POST:/v1/responses" omni_text;
    ~^POST:/v1(?:beta)?/models/[^/:]+:(?:generateContent|streamGenerateContent)$ omni_text;
}
map $http_upgrade $omni_target {
    default omni_primary;
    "" $omni_route;
}
