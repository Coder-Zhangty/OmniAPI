services:
  nginx:
    volumes:
      - ./nginx/acme-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./certbot/www:/var/www/certbot:ro
  certbot:
    image: ${CERTBOT_IMAGE:?Run init and lock-images}
    profiles: [acme]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
